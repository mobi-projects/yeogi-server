spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      port: 6379
      password:
      host: redis-server

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  h2:
    console:
      enabled: true # console enabled
      path: /h2-console  # rootPath:port/h2-console (ex : localhost:8080/h2-console)
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 1000 # TODO : remove and fetchJoin || ~
    open-in-view: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres-server:5432/postgres
    username: postgres
    password: postgres
#    driver-class-name: org.h2.Driver
#    username: sa
#    password:
#    url: jdbc:h2:tcp://localhost/~/yeogi

logging:
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL_ERROR}
  config: classpath:logback.xml
jasypt:
  encryptor:
    bean: jasyptStringEncryptor
    password : ${JASYPT_PASSWORD}
